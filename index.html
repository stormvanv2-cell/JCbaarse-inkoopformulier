  .background-overlay { position:fixed; inset:0; z-index:1; pointer-events:none;
    background: linear-gradient(110deg, rgba(3,5,10,0.90) 0%, rgba(5,8,15,0.62) 45%, rgba(0,25,70,0.38) 100%);
  }
  .background-glow { position:fixed; right:-180px; bottom:-180px; z-index:2; pointer-events:none;
    width:550px; height:550px; border-radius:50%;
    background: rgba(23,105,255,0.22); filter: blur(120px);
  }
  body.app-mode .background-glow { opacity: 0.6; }
  .brand-logo { display:block; height:24px; width:auto; object-fit:contain; }
  .login-logo { display:block; margin: 0 auto 26px; width:min(300px, 78%); height:auto; object-fit:contain; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.5)); }
  a { color:#8db6ff; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .shell { min-height:100vh; display:flex; flex-direction:column; }
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 32px; border-bottom:1px solid var(--border);
    background: rgba(8,12,20,0.55); backdrop-filter: blur(14px);
    position: sticky; top:0; z-index:10;
  }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-0.3px; font-size:18px; }
  .brand-mark { width:30px; height:30px; border-radius:8px; background: linear-gradient(135deg, var(--accent), #0645bc); display:grid; place-items:center; font-size:13px; font-weight:800; box-shadow:0 8px 20px rgba(0,81,255,0.35); }
  .topbar-right { display:flex; align-items:center; gap:14px; }
  .pill { font-size:12px; color:var(--muted); padding:6px 12px; border:1px solid var(--border); border-radius:999px; background: rgba(255,255,255,0.04); }
  .btn { font-family:inherit; cursor:pointer; border:0; border-radius:11px; font-size:14px; font-weight:600; padding:11px 18px; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { color:#fff; background: linear-gradient(135deg, var(--accent), #0645bc); box-shadow: 0 10px 24px rgba(0,81,255,0.28); }
  .btn-primary:hover { box-shadow: 0 14px 30px rgba(0,81,255,0.4); }
  .btn-ghost { color: var(--text); background: rgba(255,255,255,0.07); border:1px solid var(--border); }
  .btn-ghost:hover { background: rgba(255,255,255,0.12); }
  .btn-danger { color:#fff; background: rgba(255,92,92,0.14); border:1px solid rgba(255,92,92,0.4); }
  .btn-danger:hover { background: rgba(255,92,92,0.24); }
  .btn-sm { padding:7px 12px; font-size:13px; border-radius:9px; }
  main.content { flex:1; padding: 28px 32px 60px; max-width:1180px; width:100%; margin:0 auto; }

  /* ---- login ---- */
  .center-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { width:100%; max-width:430px; padding:42px; background: linear-gradient(145deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:24px; box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08); backdrop-filter: blur(22px); }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; margin-bottom:14px; color:var(--accent-light); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
  .eyebrow::before { content:""; width:26px; height:2px; border-radius:10px; background: var(--accent); }
  .login-card h1 { margin-bottom:8px; font-size:32px; font-weight:700; letter-spacing:-1px; }
  .login-card .sub { margin-bottom:28px; color:var(--muted); font-size:14px; line-height:1.55; }
  .form-group { margin-bottom:16px; }

<script>
/* =========================================================================
   JC Baarse — Inkoop Duitsland digitaal
   Eenvoudige front-end app met persistente opslag in de browser (localStorage).
   Let op: dit is een client-side prototype zonder echte backend-beveiliging
   én zonder gedeelde database. localStorage bewaart data alleen lokaal, per
   browser/computer — als een collega op een andere computer inlogt, ziet
   die persoon niet automatisch dezelfde auto-dossiers. Voor écht gedeelde,
   apparaat-onafhankelijke data is een online database (bv. Firebase/Supabase)
   of een eigen backend nodig.
   Wachtwoorden worden gehasht opgeslagen maar dit is geen enterprise-grade
   authenticatie.
   ========================================================================= */

const LS_PREFIX = 'jcb_';
const DEFAULT_ACCOUNT = { username: 'RBaarse', password: 'James2026!' };

let currentUser = null; // alleen in-memory, geen sessie-opslag
let carsCache = [];

const $app = document.getElementById('app');

/* ---------------- storage helpers (localStorage) ---------------- */
function lsRead(key) {
  const v = localStorage.getItem(LS_PREFIX + key);
  return v === null ? null : v;
}
function lsWrite(key, value) {
  localStorage.setItem(LS_PREFIX + key, value);
  return true;
}
function lsRemove(key) {
  localStorage.removeItem(LS_PREFIX + key);
}
function lsKeysWithPrefix(prefix) {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(LS_PREFIX + prefix)) out.push(k.slice(LS_PREFIX.length));
  }
  return out;
}

async function getAccounts() {
  try {
    const raw = lsRead('accounts');
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
async function saveAccounts(list) {
  const ok = lsWrite('accounts', JSON.stringify(list));
  if (!ok) throw new Error('Opslag heeft de accounts niet kunnen bewaren.');
  return true;
}
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function ensureSeedAccount() {
  const accounts = await getAccounts();
  if (accounts.length === 0) {
    const passHash = await sha256(DEFAULT_ACCOUNT.password);
    await saveAccounts([{ username: DEFAULT_ACCOUNT.username, passHash, createdAt: new Date().toISOString() }]);
  }
}
async function listCarKeys() {
  try {
    return lsKeysWithPrefix('car:');
  } catch (e) { return []; }
}
async function getCar(key) {
  try {
    const raw = lsRead(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
async function saveCar(car) {
  const ok = lsWrite('car:' + car.id, JSON.stringify(car));
  if (!ok) throw new Error('Opslag heeft dit dossier niet kunnen bewaren.');
  return true;
}
async function deleteCarKey(id) {
  try { lsRemove('car:' + id); } catch (e) {}
}
async function loadAllCars() {
  const keys = await listCarKeys();
  const cars = [];
  for (const k of keys) {
    const c = await getCar(k);
    if (c) cars.push(c);
  }
  cars.sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||''));
  carsCache = cars;
  return cars;
}

function uid() { return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) {
  if (!d) return '—';
  const [y,m,day] = d.split('-');
  return day && m && y ? `${day}-${m}-${y}` : d;
}
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast ok';
  t.innerHTML = `<span class="toast-dot"></span>${esc(msg)}`;
  document.body.appendChild(t);

}

/* ---------------- form config ---------------- */
// Elk item: id, label, en optionele: hasDate, hasPrice, priceLabel,

  { id:'model', label:'Model', required:true },

/* count total checkable "leaf" fields for progress bar */
function countLeafs(items, acc) {
  acc = acc || { total:0, done:0 };
  for (const it of items) {
    if (it.isGroupOnly) { /* no own field */ }
    else if (it.plainText || it.plainPrice) { acc.total++; }
    else if (it.onlyBool) { acc.total++; }
    else if (it.hasDate) { acc.total++; }
    else if (it.choices || it.radio) { acc.total++; }
    if (it.children) countLeafs(it.children, acc);
  }
  return acc;
}
function isItemDone(it, v) {
  if (it.isGroupOnly) return false;
  if (it.plainText) return !!v[it.id+':text'];
  if (it.plainPrice) return !!v[it.id+':price'];
  if (it.onlyBool) return !!v[it.id+':bool'];
  if (it.hasDate) return !!v[it.id+':date'];
  if (it.choices) return (it.choices||[]).some(c => v[it.id+':choice:'+c.id]);
  if (it.radio) return !!v[it.id+':radio'];
  return false;
}
function computeProgress(car) {
  const v = car.values || {};
  let total = 0, done = 0;
  for (const sec of FORM_SECTIONS) {
    const walk = (items) => {
      for (const it of items) {
        if (!it.isGroupOnly) { total++; if (isItemDone(it, v)) done++; }
        if (it.children) walk(it.children);
      }
    };
    walk(sec.items);
  }
  return total ? Math.round((done/total)*100) : 0;
}

/* ---------------- rendering: item tree ---------------- */
function renderItemFields(it, v) {
  let html = '<div class="item-fields">';
  if (it.plainText) {
    html += `<div class="field-inline"><label>${esc(it.label)}</label><input class="field-text-wide" data-field="${it.id}:text" value="${esc(v[it.id+':text'])}"></div>`;
    html += '</div>'; return html;
  }
  if (it.plainPrice) {
    html += `<div class="field-inline field-price-wrap"><label>${esc(it.label)}</label><input type="number" step="0.01" class="field-price" data-field="${it.id}:price" value="${esc(v[it.id+':price'])}"></div>`;
    html += '</div>'; return html;
  }
  if (it.onlyBool) {
    html += `<label class="bool-solo"><input type="checkbox" data-field="${it.id}:bool" ${v[it.id+':bool']?'checked':''}> ${esc(it.label)}</label>`;
    html += '</div>'; return html;
  }
  // header label shown separately for regular items; build controls
  if (it.hasText) {
    html += `<div class="field-inline"><label>${esc(it.hasText)}</label><input class="field-text" data-field="${it.id}:text" value="${esc(v[it.id+':text'])}"></div>`;
  }
  if (it.hasDate) {
    html += `<div class="field-inline"><label>Datum</label><input type="date" class="field-date" data-field="${it.id}:date" value="${esc(v[it.id+':date'])}"></div>`;
  }
  if (it.hasPrice) {
    html += `<div class="field-inline field-price-wrap"><label>${esc(it.priceLabel||'Bedrag')}</label><input type="number" step="0.01" class="field-price" data-field="${it.id}:price" value="${esc(v[it.id+':price'])}"></div>`;
  }
  if (it.choices) {
    html += `<div class="field-inline"><label>&nbsp;</label><div class="choices-row">`;
    for (const c of it.choices) {
      html += `<label class="check-choice"><input type="checkbox" data-field="${it.id}:choice:${c.id}" ${v[it.id+':choice:'+c.id]?'checked':''}> ${esc(c.label)}</label>`;
    }
    html += `</div></div>`;
  }
  if (it.radio) {
    html += `<div class="field-inline"><label>&nbsp;</label><div class="choices-row">`;
    for (const c of it.radio) {
      html += `<label class="radio-choice"><input type="radio" name="radio-${it.id}" data-field="${it.id}:radio" value="${c.id}" ${v[it.id+':radio']===c.id?'checked':''}> ${esc(c.label)}</label>`;
    }
    html += `</div></div>`;
  }
  if (it.boolExtra) {
    html += `<label class="check-choice" style="align-self:flex-end;"><input type="checkbox" data-field="${it.boolExtra.id}:bool" ${v[it.boolExtra.id+':bool']?'checked':''}> ${esc(it.boolExtra.label)}</label>`;
  }
  html += '</div>';
  return html;
}
function renderItemTree(items, v, depth) {
  let html = '';
  for (const it of items) {
    html += `<div class="item-row ${depth>0?'depth-'+Math.min(depth,2):''}">`;
    if (!it.onlyBool && !it.plainText && !it.plainPrice) {
      html += `<span class="item-label">${esc(it.label)}</span>`;
    }
    html += renderItemFields(it, v);
    if (it.children) html += renderItemTree(it.children, v, depth+1);
    html += `</div>`;
  }
  return html;
}

/* ---------------- gather values from form DOM ---------------- */
function gatherValues(root) {
  const v = {};
  root.querySelectorAll('[data-field]').forEach(el => {
    const key = el.getAttribute('data-field');
    if (el.type === 'checkbox') v[key] = el.checked;
    else if (el.type === 'radio') { if (el.checked) v[key] = el.value; }
    else v[key] = el.value;
  });
  return v;
}

            <label class="form-label" for="su-username">Gebruikersnaam</label>
            <input class="form-input" id="su-username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="su-password">Wachtwoord</label>
            <input class="form-input" id="su-password" type="password" autocomplete="new-password" required minlength="4">
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%; height:50px;">Account aanmaken &amp; inloggen</button>
        </form>
        <div class="hint-box">Let op: dit is een lichtgewicht dossierbeheer zonder externe beveiligingslaag. Deel de link alleen met collega's die toegang mogen hebben.</div>
      </div>
    </div>`;
  document.getElementById('setup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('setup-error');
    errBox.innerHTML = '';
    const username = document.getElementById('su-username').value.trim();
    const password = document.getElementById('su-password').value;
    if (!username) { errBox.innerHTML = `<div class="error-box">Vul een gebruikersnaam in.</div>`; return; }
    if (password.length < 4) { errBox.innerHTML = `<div class="error-box">Wachtwoord moet minimaal 4 tekens zijn.</div>`; return; }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Bezig…';
    try {
      const passHash = await sha256(password);
      const accounts = [{ username, passHash, createdAt: new Date().toISOString() }];
      await saveAccounts(accounts);
      currentUser = { username };
      renderDashboard();
    } catch (err) {
      console.error(err);
      errBox.innerHTML = `<div class="error-box">Er ging iets mis bij het opslaan: ${esc(err.message || err)}</div>`;
      btn.disabled = false; btn.textContent = 'Account aanmaken & inloggen';
    }
  });
}

            <label class="form-label" for="username">Gebruikersnaam</label>
            <input class="form-input" id="username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Wachtwoord</label>
            <input class="form-input" id="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%; height:50px;">Inloggen</button>
        </form>
      </div>
    </div>`;
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('login-error');
    errBox.innerHTML = '';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Bezig…';
    try {
      const accounts = await getAccounts();
      const hash = await sha256(password);
      const found = accounts.find(a => a.username.toLowerCase() === username.toLowerCase() && a.passHash === hash);
      if (!found) {
        errBox.innerHTML = `<div class="error-box">Gebruikersnaam of wachtwoord onjuist.</div>`;
        btn.disabled = false; btn.textContent = 'Inloggen';
        return;
      }
      currentUser = { username: found.username };
      renderDashboard();
    } catch (err) {
      console.error(err);
      errBox.innerHTML = `<div class="error-box">Er ging iets mis bij het inloggen: ${esc(err.message || err)}</div>`;
      btn.disabled = false; btn.textContent = 'Inloggen';
    }
  });
}

      <button class="btn btn-ghost btn-sm" id="nav-logout">Uitloggen</button>
    </div>
  </div>`;
}
function wireTopbar() {
  document.getElementById('nav-logout').addEventListener('click', () => { currentUser = null; renderSetupOrLogin(); });
  document.getElementById('nav-accounts').addEventListener('click', renderAccountsPage);
}

async function renderDashboard() {
  $app.innerHTML = `<div class="shell">${topbar('dashboard')}<main class="content" id="main"></main></div>`;
  wireTopbar();
  const main = document.getElementById('main');
  main.innerHTML = `<div class="pill" style="width:fit-content;">Dossiers laden…</div>`;
  const cars = await loadAllCars();
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Auto-dossiers</h1>
        <p>${cars.length} voertuig${cars.length===1?'':'en'} in het systeem</p>
      </div>
      <button class="btn btn-primary" id="btn-new">+ Nieuw formulier</button>
    </div>
    <div class="toolbar">
      <input class="form-input search-input" id="search" placeholder="Zoek op merk, model of chassisnummer…">
    </div>
    <div class="grid-cars" id="grid"></div>
  `;
  document.getElementById('btn-new').addEventListener('click', () => renderCarForm(null));
  document.getElementById('search').addEventListener('input', (e) => paintGrid(e.target.value));
  paintGrid('');

  function paintGrid(query) {
    const grid = document.getElementById('grid');
    const q = query.trim().toLowerCase();
    const filtered = cars.filter(c => !q ||
      (c.merk||'').toLowerCase().includes(q) ||
      (c.model||'').toLowerCase().includes(q) ||
      (c.chassisnr||'').toLowerCase().includes(q));
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <h3>${cars.length===0 ? 'Nog geen dossiers' : 'Niets gevonden'}</h3>
        <p>${cars.length===0 ? "Klik op 'Nieuw formulier' om het eerste voertuig aan te maken." : 'Pas je zoekopdracht aan.'}</p>
      </div>`;
      return;
    }
    grid.innerHTML = filtered.map(c => {
      const progress = computeProgress(c);
      return `
      <div class="car-card" data-id="${c.id}">
        <div class="car-top">
          <div>
            <h3>${esc(c.merk||'—')} ${esc(c.model||'')}</h3>
            <div class="model">${esc(c.kleur||'')}</div>
          </div>
          <span class="badge badge-progress">${progress}%</span>
        </div>
        <div class="car-meta">
          <span>Chassisnr: <b>${esc(c.chassisnr||'—')}</b></span>
          <span>Leverancier: <b>${esc(c.leverancier||'—')}</b></span>
          <span>Laatst gewijzigd: <b>${c.updatedAt ? new Date(c.updatedAt).toLocaleDateString('nl-NL') : '—'}</b></span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
      </div>`;
    }).join('');
    grid.querySelectorAll('.car-card').forEach(card => {
      card.addEventListener('click', () => renderCarForm(card.getAttribute('data-id')));
    });
  }
}

async function renderCarForm(carId) {
  const isNew = !carId;
  let car = isNew ? { id: uid(), values:{}, createdAt: new Date().toISOString() } : carsCache.find(c => c.id === carId);
  if (!car) car = { id: uid(), values:{}, createdAt: new Date().toISOString() };
  const v = car.values || {};

  $app.innerHTML = `<div class="shell">${topbar('form')}<main class="content" id="main"></main></div>`;
  wireTopbar();
  const main = document.getElementById('main');

  const headerFieldsHtml = HEADER_FIELDS.map(f => {
    if (f.type === 'select') {
      return `<div class="form-group">
        <label class="form-label">${esc(f.label)}</label>
        <select class="form-input" data-header="${f.id}">
          <option value=""></option>
          ${f.options.map(o => `<option value="${o}" ${car[f.id]===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>`;
    }
    return `<div class="form-group">
      <label class="form-label">${esc(f.label)}${f.required?' *':''}</label>
      <input class="form-input" type="${f.type||'text'}" data-header="${f.id}" value="${esc(car[f.id])}">
    </div>`;
  }).join('');

  const sectionsHtml = FORM_SECTIONS.map(sec => `
    <div class="section-card">
      <h2>${esc(sec.title)}</h2>
      ${renderItemTree(sec.items, v, 0)}
    </div>
  `).join('');

  main.innerHTML = `
    <div class="back-link" id="back-link">← Terug naar overzicht</div>
    <div class="page-head">
      <div>
        <h1>${isNew ? 'Nieuw formulier' : (esc(car.merk||'Dossier') + ' ' + esc(car.model||''))}</h1>
        <p>${isNew ? 'Vul de gegevens in voor dit voertuig.' : 'Wijzigingen worden opgeslagen in het dossier.'}</p>
      </div>
      ${!isNew ? `<button class="btn btn-danger btn-sm" id="btn-delete">Verwijder dossier</button>` : ''}
    </div>
    <div class="form-header-card">
      <div class="field-grid">${headerFieldsHtml}</div>
    </div>
    <form id="car-form">
      ${sectionsHtml}
      <div class="save-bar">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Annuleren</button>
        <button type="submit" class="btn btn-primary">Formulier opslaan</button>
      </div>
    </form>
  `;

  document.getElementById('back-link').addEventListener('click', renderDashboard);
  document.getElementById('btn-cancel').addEventListener('click', renderDashboard);
  if (!isNew) {
    document.getElementById('btn-delete').addEventListener('click', async () => {
      if (!confirm('Dit dossier definitief verwijderen? Dit kan niet ongedaan worden gemaakt.')) return;
      await deleteCarKey(car.id);
      showToast('Dossier verwijderd');
      renderDashboard();
    });
  }

  document.getElementById('car-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const headerVals = {};
    main.querySelectorAll('[data-header]').forEach(el => { headerVals[el.getAttribute('data-header')] = el.value; });
    if (!headerVals.merk || !headerVals.model) {
      alert('Vul minimaal merk en model in.');
      return;
    }
    const values = gatherValues(document.getElementById('car-form'));
    const updated = {
      ...car,
      ...headerVals,
      values,
      updatedAt: new Date().toISOString(),
      updatedBy: currentUser.username,
    };
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Opslaan…';
    try {
      await saveCar(updated);
      showToast('Formulier opgeslagen');
      renderDashboard();
    } catch (err) {
      console.error(err);
      alert('Opslaan is mislukt: ' + (err.message || err));
      btn.disabled = false; btn.textContent = 'Formulier opslaan';
    }
  });
}

async function renderAccountsPage() {
  $app.innerHTML = `<div class="shell">${topbar('accounts')}<main class="content" id="main"></main></div>`;
  wireTopbar();
  const main = document.getElementById('main');
  const accounts = await getAccounts();
  main.innerHTML = `
    <div class="back-link" id="back-link">← Terug naar overzicht</div>
    <div class="page-head">
      <div><h1>Accounts beheren</h1><p>Voeg nieuwe collega's toe die kunnen inloggen op dit dossier.</p></div>
    </div>
    <div class="section-card">
      <h2>Nieuw account</h2>
      <div id="acc-error"></div>
      <form id="acc-form" class="field-grid" style="align-items:flex-end;">
        <div class="form-group"><label class="form-label">Gebruikersnaam</label><input class="form-input" id="acc-username" required></div>
        <div class="form-group"><label class="form-label">Wachtwoord</label><input class="form-input" id="acc-password" type="password" minlength="4" required></div>
        <button class="btn btn-primary" type="submit" style="height:50px;">Account toevoegen</button>
      </form>
    </div>
    <div class="section-card">
      <h2>Bestaande accounts</h2>
      <table class="table-accounts">
        <thead><tr><th>Gebruikersnaam</th><th>Aangemaakt op</th><th></th></tr></thead>
        <tbody id="acc-rows"></tbody>
      </table>
    </div>
  `;
  document.getElementById('back-link').addEventListener('click', renderDashboard);

  function paintRows(list) {
    document.getElementById('acc-rows').innerHTML = list.map(a => `
      <tr>
        <td>${esc(a.username)}</td>
        <td>${a.createdAt ? new Date(a.createdAt).toLocaleDateString('nl-NL') : '—'}</td>
        <td>${list.length > 1 ? `<button class="btn btn-danger btn-sm" data-remove="${esc(a.username)}">Verwijderen</button>` : ''}</td>
      </tr>
    `).join('');
    document.getElementById('acc-rows').querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const uname = btn.getAttribute('data-remove');
        if (!confirm(`Account "${uname}" verwijderen?`)) return;
        const cur = await getAccounts();
        const next = cur.filter(a => a.username !== uname);
        await saveAccounts(next);
        paintRows(next);
        showToast('Account verwijderd');
      });
    });
  }
  paintRows(accounts);

  document.getElementById('acc-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('acc-error');
    errBox.innerHTML = '';
    const username = document.getElementById('acc-username').value.trim();
    const password = document.getElementById('acc-password').value;
    if (!username || password.length < 4) {
      errBox.innerHTML = `<div class="error-box">Vul een gebruikersnaam in en een wachtwoord van minimaal 4 tekens.</div>`;
      return;
    }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Bezig…';
    try {
      const cur = await getAccounts();
      if (cur.some(a => a.username.toLowerCase() === username.toLowerCase())) {
        errBox.innerHTML = `<div class="error-box">Deze gebruikersnaam bestaat al.</div>`;
        btn.disabled = false; btn.textContent = 'Account toevoegen';
        return;
      }
      const passHash = await sha256(password);
      cur.push({ username, passHash, createdAt: new Date().toISOString() });
      await saveAccounts(cur);
      document.getElementById('acc-username').value = '';
      document.getElementById('acc-password').value = '';
      paintRows(cur);
      showToast('Account toegevoegd');
    } catch (err) {
      console.error(err);
      errBox.innerHTML = `<div class="error-box">Opslaan mislukt: ${esc(err.message || err)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Account toevoegen';
    }
  });
}

/* ---------------- boot ---------------- */
function renderEnvError(reason) {
  $app.innerHTML = `
    <div class="center-wrap">
      <div class="login-card">
        <div class="eyebrow">Kan niet starten</div>
        <h1>Omgeving niet ondersteund</h1>
        <div class="error-box">${esc(reason)}</div>
        <p class="sub">Controleer of je browser cookies/opslag toestaat voor deze site (geen incognito-modus met opslag uitgeschakeld, geen strikte privacy-instellingen die localStorage blokkeren).</p>
      </div>
    </div>`;
}
(async function boot() {
  try {
    localStorage.setItem(LS_PREFIX + 'test', '1');
    localStorage.removeItem(LS_PREFIX + 'test');
  } catch (e) {
    renderEnvError('De opslag van je browser (localStorage) is niet beschikbaar of geblokkeerd.');
    return;
  }
  if (!window.crypto || !window.crypto.subtle) {
    renderEnvError('Deze browseromgeving ondersteunt geen beveiligde crypto-functies (crypto.subtle). Dit werkt alleen via https of localhost.');
    return;
  }
  try {
    await ensureSeedAccount();
    await renderSetupOrLogin();
  } catch (err) {
    console.error(err);
    renderEnvError('Onverwachte fout bij het opstarten: ' + (err.message || err));
  }
})();
</script>
